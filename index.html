<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TATAKI | Japanese Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Permanent+Marker&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#101010;--tx:#F5F5F5;--rd:#C51F2B;--gr:#9a9a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Kufi Arabic',sans-serif;overflow-x:hidden;
background-image:radial-gradient(circle at 20% 10%,#1d1d1d,transparent 50%),radial-gradient(circle at 80% 60%,#181818,transparent 50%),repeating-radial-gradient(circle at 50% 100%,transparent 0 22px,rgba(255,255,255,.018) 22px 24px)}
body::before{content:"";position:fixed;left:50%;top:42%;width:min(90vw,620px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(197,31,43,.16),transparent 66%);pointer-events:none;z-index:0}
body::after{content:"TATAKI";position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Zen Dots';font-size:min(19vw,170px);color:rgba(255,255,255,.025);letter-spacing:.1em;pointer-events:none;z-index:0;white-space:nowrap}
html::after{content:"JO";position:fixed;left:50%;top:calc(50% + min(12vw,105px));transform:translateX(-50%);font-family:'Zen Dots';font-size:min(9vw,80px);color:rgba(255,255,255,.025);letter-spacing:.5em;padding-left:.5em;pointer-events:none;z-index:0}
.z{font-family:'Permanent Marker','Zen Dots',sans-serif}.br{font-family:'Kaushan Script',cursive}
header{position:relative;z-index:1;text-align:center;padding:36px 16px 20px}
header img{width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 3px var(--rd),0 10px 40px rgba(197,31,43,.35)}
h1{margin:16px 0 4px;font-size:clamp(28px,8vw,52px);letter-spacing:.14em;font-weight:400}
.sub{color:var(--gr);letter-spacing:.35em;font-size:12px}
.tel{display:inline-block;margin-top:14px;padding:9px 22px;border:1px solid var(--rd);color:var(--tx);text-decoration:none;border-radius:30px;transition:.3s;direction:ltr}
.tel:hover{background:var(--rd)}
nav{position:sticky;top:0;z-index:5;background:rgba(16,16,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid #2a2a2a;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));scrollbar-width:none;align-items:center}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--gr);text-decoration:none;font-size:12px;padding:6px 12px;border:1px solid #333;border-radius:20px;transition:.3s;white-space:nowrap}
nav a:hover{color:#fff;border-color:var(--rd);background:rgba(197,31,43,.2)}
#lg{flex:none;background:var(--rd);color:#fff;border:0;border-radius:20px;padding:7px 14px;font:inherit;font-size:12px;cursor:pointer;position:sticky;left:0}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:10px 14px 30px}
section{padding-top:34px}
.h{text-align:center;margin-bottom:22px}
.h h2{font-family:'Permanent Marker','Zen Dots';font-weight:400;font-size:clamp(22px,6.4vw,40px);margin:0;letter-spacing:.08em}
.h h2::after{content:"";display:block;width:2px;height:26px;background:var(--rd);margin:10px auto}
.h .a{font-size:clamp(14px,3.8vw,20px);color:var(--gr)}
.sv{display:inline-block;margin-top:8px;font-size:12px;color:var(--rd);border:1px solid var(--rd);padding:2px 12px;border-radius:12px}
.it{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding:14px 4px;border-bottom:1px solid #262626;transition:.3s}
.it:hover{background:rgba(255,255,255,.03)}
.en{text-align:left;direction:ltr}.ar{text-align:right;direction:rtl}
.en b{display:block;font-family:'Permanent Marker';letter-spacing:.03em;font-weight:400;font-size:clamp(17px,4.6vw,24px);line-height:1.25}
.ar b{display:block;font-weight:600;font-size:clamp(14px,3.8vw,18px);line-height:1.5}
.en p,.ar p{margin:5px 0 0;color:var(--gr);font-size:clamp(11px,2.9vw,13px);line-height:1.6}
.pr{text-align:center;font-family:'Zen Dots';color:var(--rd);font-size:clamp(14px,4vw,20px);min-width:64px;padding-top:4px;direction:ltr}
.pr small{display:block;font-size:10px;color:var(--gr);letter-spacing:.2em}
body.le .ar,body.la .en{display:none}
body.le .it,body.la .it{grid-template-columns:1fr auto;}
body.la .ar{grid-column:1;grid-row:1}body.la .pr{grid-column:2;grid-row:1}
body.la .it{direction:rtl}
footer{position:relative;z-index:1;text-align:center;padding:30px 16px 50px;color:var(--gr);font-size:13px}
.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin:14px 0 24px}
.lg span{border:1px solid #333;padding:6px 14px;border-radius:20px}
.lg i{color:var(--rd);font-style:normal;margin-inline-end:6px}
.it{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.it.sel{background:rgba(197,31,43,.15);box-shadow:inset 0 0 0 1px var(--rd);border-radius:6px}
.it.sel::after{content:"✓";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--rd);color:#fff;font-size:12px;font-family:sans-serif}
section{animation:f .7s both}@keyframes f{from{opacity:0;transform:translateY(14px)}}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(16,16,16,.96);backdrop-filter:blur(8px);border-top:2px solid var(--rd);transform:translateY(110%);transition:transform .4s;direction:ltr}
#bar.on{transform:none}
#bar div{font-size:13px;line-height:1.5}
#bar b{font-family:'Zen Dots';color:var(--rd);font-size:17px;font-weight:400}
#bar button{background:none;border:1px solid #444;color:var(--gr);border-radius:16px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
footer{padding-bottom:90px}
</style></head><body class="lb">
